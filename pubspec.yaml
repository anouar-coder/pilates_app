name: pilates_app
description: Application de gestion de cours de Pilates
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  url_launcher: ^6.2.1  # Pour ouvrir les liens YouTube
  youtube_player_iframe: ^5.0.0  # Pour intégrer YouTube directement
  webview_flutter: ^4.4.4
  webview_flutter_web: ^0.2.2 
  # Images
  image_picker: ^1.1.2

  # Pour le calendrier
  table_calendar: ^3.0.9

   # Pour Stripe
  stripe_payment: ^1.1.4
  flutter_stripe: ^10.1.1  
  http: ^1.2.2
  # Utilitaires
  intl: ^0.20.2
  
  # Notifications locales
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true